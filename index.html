<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Camera Demo — Stabil Analog</title>
<style>
body{margin:0;font-family:sans-serif;background:#111;color:#eee;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100vh;}
header{padding:10px;text-align:center;} 
video,canvas{max-width:100%;border-radius:12px;}
.controls{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
button{padding:10px 16px;border:none;border-radius:10px;background:#e6a85e;color:#111;font-weight:600;cursor:pointer;}
label{display:block;text-align:center;margin-top:8px;}
input[type=range]{width:200px;}
</style>
</head>
<body>

<header>
<h1>Pro Camera Demo</h1>
<p>Analog preset + Gren + Safari / iPhone uyumlu</p>
</header>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none"></canvas>

<div class="controls">
<button id="snap">📸 Çek</button>
<button id="reset">🔄 Reset</button>
<label>Grain: <span id="grainVal">30</span></label>
<input type="range" id="grain" min="0" max="100" value="30">
<label><input type="checkbox" id="grainToggle" checked> Gren aktif</label>
<select id="presetSelect">
<option value="kodak">Kodak Warm</option>
<option value="fuji">Fuji Vivid</option>
<option value="mono">Mono 400</option>
</select>
<button id="downloadBtn" disabled>İndir</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const snapBtn = document.getElementById('snap');
const resetBtn = document.getElementById('reset');
const grainSlider = document.getElementById('grain');
const grainVal = document.getElementById('grainVal');
const grainToggle = document.getElementById('grainToggle');
const presetSelect = document.getElementById('presetSelect');
const downloadBtn = document.getElementById('downloadBtn');

let lastImage = null;
let currentPreset = 'kodak';

async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    video.srcObject = stream;
  }catch(e){
    alert('Kamera açılamadı: '+e.message);
  }
}
startCamera();

// Normalize renk hesaplaması
function clamp(v){return Math.min(255, Math.max(0, v));}

// Basit preset tanımları
const PRESETS = {
  kodak:{brightness:1.05, contrast:1.05, saturate:1.1, sepia:0.2},
  fuji:{brightness:1.02, contrast:1.08, saturate:1.25, sepia:0.05},
  mono:{brightness:1.0, contrast:1.1, saturate:0.4, sepia:0}
};

function applyPreset(imageData){
  const data = imageData.data;
  const s = PRESETS[currentPreset];
  for(let i=0;i<data.length;i+=4){
    // normalize [0,255] float
    let r=data[i]/255, g=data[i+1]/255, b=data[i+2]/255;
    // brightness
    r*=s.brightness; g*=s.brightness; b*=s.brightness;
    // contrast simple
    r=((r-0.5)*s.contrast+0.5); g=((g-0.5)*s.contrast+0.5); b=((b-0.5)*s.contrast+0.5);
    // saturation simple lerp
    const lum=0.2126*r+0.7152*g+0.0722*b;
    r=lum+(r-lum)*s.saturate; g=lum+(g-lum)*s.saturate; b=lum+(b-lum)*s.saturate;
    // sepia
    if(s.sepia>0){
      const sr = r*0.393 + g*0.769 + b*0.189;
      const sg = r*0.349 + g*0.686 + b*0.168;
      const sb = r*0.272 + g*0.534 + b*0.131;
      r = r*(1-s.sepia)+sr*s.sepia;
      g = g*(1-s.sepia)+sg*s.sepia;
      b = b*(1-s.sepia)+sb*s.sepia;
    }
    // geri [0,255]
    data[i]=clamp(r*255); data[i+1]=clamp(g*255); data[i+2]=clamp(b*255);
  }
  return imageData;
}

// Gren ekleme
function applyGrain(){
  if(!lastImage || !grainToggle.checked) return;
  const data = ctx.getImageData(0,0,canvas.width,canvas.height);
  const intensity = grainSlider.value/100;
  for(let i=0;i<data.data.length;i+=4){
    const noise = (Math.random()*2-1)*255*intensity*0.3;
    data.data[i]+=noise; data.data[i+1]+=noise; data.data[i+2]+=noise;
  }
  ctx.putImageData(data,0,0);
}

snapBtn.addEventListener('click',()=>{
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video,0,0,canvas.width,canvas.height);
  let imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
  imageData = applyPreset(imageData);
  ctx.putImageData(imageData,0,0);
  applyGrain();
  canvas.style.display='block';
  video.style.display='none';
  lastImage = true;
  downloadBtn.disabled=false;
});

resetBtn.addEventListener('click',()=>{
  canvas.style.display='none';
  video.style.display='block';
  lastImage=null;
  downloadBtn.disabled=true;
});

grainSlider.addEventListener('input',()=>{grainVal.textContent=grainSlider.value; if(lastImage) snapBtn.click();});
grainToggle.addEventListener('change',()=>{if(lastImage) snapBtn.click();});
presetSelect.addEventListener('change',(e)=>{currentPreset=e.target.value;if(lastImage) snapBtn.click();});

downloadBtn.addEventListener('click',()=>{
  const url = canvas.toDataURL('image/jpeg',0.92);
  const a=document.createElement('a');
  a.href=url;
  a.download=`photo_${Date.now()}.jpg`;
  a.click();
});
</script>
</body>
</html>
